
services:
  postgres:
    image: postgres:16-alpine
    container_name: bsp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bsp_whatsapp_enterprise
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./docs/schema/001_enterprise_schema.sql:/docker-entrypoint-initdb.d/001_enterprise_schema.sql:ro
      - ./docs/schema/002_centralized_knowledge_and_generation.sql:/docker-entrypoint-initdb.d/002_centralized_knowledge_and_generation.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bsp_whatsapp_enterprise"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bsp_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bsp_api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/bsp_whatsapp_enterprise
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bsp_worker
    restart: unless-stopped
    command: arq app.core.worker.WorkerSettings
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/bsp_whatsapp_enterprise
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
